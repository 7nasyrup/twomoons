<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>青い月の裏側で - Behind the Blue Moon</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700&family=Orbitron:wght@500;800&family=Rajdhani:wght@500;600;700&family=DotGothic16&display=swap"
    rel="stylesheet">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        let unregistered = false;
        for(let registration of registrations) {
          registration.unregister();
          unregistered = true;
        }
        if (unregistered) {
          window.location.reload(true);
        }
      });
    }
  </script>
</head>

<body class="bg-black select-none">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
