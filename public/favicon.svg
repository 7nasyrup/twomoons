<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
  </defs>
  
  <!-- Outer clean frame -->
  <circle cx="50" cy="50" r="48" fill="#030712" stroke="url(#ring-grad)" stroke-width="2" />
  
  <!-- Inner subtle frame -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#00f5ff" stroke-width="0.5" stroke-opacity="0.4" />

  <!-- The Two Moons (Cyan Crescent) -->
  <circle cx="48" cy="48" r="32" fill="#00f5ff" opacity="0.85" />
  <circle cx="41" cy="41" r="33" fill="#030712" />

  <!-- Cyber Grid Lines -->
  <line x1="2" y1="50" x2="98" y2="50" stroke="#00f5ff" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.4" />
  <line x1="50" y1="2" x2="50" y2="98" stroke="#00f5ff" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.4" />
</svg>
